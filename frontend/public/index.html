<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/kcinema.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/kcinema.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>K. Cinema</title>
    <style>
      /* Chatbot Container Styling */
      df-messenger {
        --df-messenger-bot-message: #f44336; /* Bot message bubble background */
        --df-messenger-button-titlebar-color: #ff0000; /* Title bar text color */
        --df-messenger-chat-background-color: #f9f9f9; /* Chat background color */
        --df-messenger-font-color: #ffffff; /* Font color */
        --df-messenger-input-box-color: #ffffff; /* Input box background color */
        --df-messenger-send-icon: #f44336; /* Send button color */
        --df-messenger-user-message: #919191; /* User message bubble background */
        --df-messenger-titlebar-color: #000; /* Title bar background */
        --df-messenger-minimized-chatbot-icon: url('%PUBLIC_URL%/kcinema.png'); /* Icon for minimized chatbot */
      }
    
      /* Customize Chat Bubble Text Styling */
      df-messenger .df-messenger-bot-message, 
      df-messenger .df-messenger-user-message {
        font-size: 14px;
        font-family: 'Arial', sans-serif;
      }
    
      /* Adjust the Width and Position */
      df-messenger {
        width: 350px;
        max-height: 500px;
        right: 5rem !important; /* Align the chatbot to the right */
        bottom: 2rem; /* Adjust positioning from the bottom */
      }
    </style>
    
  </head>
  <body style="margin: 0;">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>
    <df-messenger
      intent="WELCOME"
      chat-title="K.Cinema_Assistant"
      agent-id="6271bc8f-8a5c-4b54-924a-b87deb806d41"
      allow="microphone"
      language-code="en"
    </df-messenger>
  </body>
</html>
